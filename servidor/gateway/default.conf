limit_req_zone $binary_remote_addr zone=onesweb_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=onesweb_conexiones:10m;

log_format onesweb '$time_iso8601 $request_id $remote_addr '
                   '$request_method $uri $status $request_time';

server {
    listen 8080;
    server_name _;
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    access_log /dev/stdout onesweb;

    client_max_body_size 10m;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 15s;
    keepalive_timeout 15s;
    large_client_header_buffers 4 8k;

    limit_conn onesweb_conexiones 20;
    limit_conn_status 429;
    limit_req_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Request-ID $request_id always;

    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Request-ID;

    error_page 413 = @cuerpo_grande;
    error_page 429 = @demasiadas_peticiones;

    location /api/ {
        limit_req zone=onesweb_api burst=20 nodelay;

        set $core_destino http://core:8080;
        proxy_pass $core_destino$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 30s;
        proxy_next_upstream off;
    }

    location @cuerpo_grande {
        default_type application/json;
        return 413 '{"codigo":413,"error":"solicitud_demasiado_grande","mensaje":"El cuerpo de la solicitud supera 10 MiB","detalles":[]}';
    }

    location @demasiadas_peticiones {
        default_type application/json;
        return 429 '{"codigo":429,"error":"limite_excedido","mensaje":"Demasiadas peticiones o conexiones; intente mas tarde","detalles":[]}';
    }

    location / {
        default_type text/plain;
        return 200 "Ones Web: servidor activo\n";
    }
}
